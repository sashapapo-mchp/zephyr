# ICM and PUKCC Crypto Sample Configuration
# Uses MbedTLS ALT drivers for hardware acceleration

# Zephyr Crypto drivers (optional - for direct Zephyr crypto API testing)
CONFIG_CRYPTO=y
CONFIG_CRYPTO_MCHP_ICM=y
CONFIG_CRYPTO_MCHP_PUKCC=y

# Enable MbedTLS
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y

# Enable MbedTLS algorithms
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y

# Enable RSA with required padding schemes
CONFIG_MBEDTLS_RSA_C=y
CONFIG_MBEDTLS_PKCS1_V15=y
CONFIG_MBEDTLS_PKCS1_V21=y
CONFIG_MBEDTLS_GENPRIME_ENABLED=y

# Enable MD wrapper module (needed for mbedtls_md API)
CONFIG_MBEDTLS_MD=y

# Enable Microchip hardware acceleration via ALT drivers
# These replace MbedTLS software implementations with hardware
CONFIG_MBEDTLS_SHA256_ALT=y
CONFIG_MBEDTLS_ECDSA_SIGN_ALT=y
CONFIG_MBEDTLS_ECDSA_VERIFY_ALT=y
CONFIG_MBEDTLS_RSA_ALT=y

# Heap for MbedTLS operations
CONFIG_HEAP_MEM_POOL_SIZE=32768

# RNG configuration
CONFIG_MBEDTLS_CTR_DRBG_ENABLED=y
CONFIG_MBEDTLS_ENTROPY_C=y

# Entropy - use hardware TRNG
CONFIG_ENTROPY_GENERATOR=y

# Stack configuration - PUKCC operations need significant stack space
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Stack protection to detect corruption
CONFIG_STACK_CANARIES=y

# Enable logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CRYPTO_LOG_LEVEL_INF=y

# Enable shell for interactive testing
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=16384

# Enable hardware info for device identification
CONFIG_HWINFO=y
